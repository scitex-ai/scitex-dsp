[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-dsp"
version = "0.1.2"
description = "Digital signal processing (PAC, Hilbert, Wavelet, filters, demo signals, …) — standalone module from the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "dsp", "signal-processing", "pytorch", "pac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas",
    "matplotlib",
    "numpy",
    "scipy",
    "torch",
    "scitex-decorators>=0.1.1",
    "scitex-gen>=0.1.3",
    "scitex-nn>=0.1.2",
]

[project.optional-dependencies]
audio = [
    "sounddevice",
]
pac = [
    "tensorpac",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
all = [
    "scitex-dsp[audio]",
    "scitex-dsp[pac]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-dsp"
Repository = "https://github.com/ywatanabe1989/scitex-dsp"
Documentation = "https://scitex-dsp.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-warnings"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
