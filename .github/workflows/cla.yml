name: CLA Assistant

# Reusable-workflow caller (scitex-ai/.github, 2026-07-10 fleet migration).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable workflow defaults (owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main) already match
# this repo's prior hardcoded values, so no `with:` overrides are needed.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    # Pass the ONE secret the callee declares, never `secrets: inherit`.
    # This job is startable by an outsider (`issue_comment`,
    # `pull_request_target`); under `secrets: inherit` every secret this
    # repo holds would be forwarded into it. The callee declares
    # `GH_PERSONAL_ACCESS_TOKEN` as an explicit `workflow_call` secret
    # precisely so callers can stop inheriting. Flagged by PS-224 §1.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
