[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-dsp"
version = "0.1.11"
description = "Digital signal processing (PAC, Hilbert, Wavelet, filters, demo signals, …) — standalone module from the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "Yusuke Watanabe", email = "noreply@scitex.ai"}]
keywords = ["scitex", "dsp", "signal-processing", "pytorch", "pac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas",
    "matplotlib",
    "numpy",
    "scipy",
    "torch",
    "xarray",
    "scitex-decorators>=0.1.1",
    "scitex-gen>=0.1.10",
    "scitex-nn>=0.1.13",
]

[project.optional-dependencies]
audio = [
    "sounddevice",
]
pac = [
    "tensorpac",
]
dev = [
    "joblib",
    "flask",
    "tensorpac",
    "sounddevice",
    "ripple_detection",
    # tests/scitex_dsp/_audio_io/test__mne.py,
    # tests/scitex_dsp/utils/test_filter.py,
    # tests/scitex_dsp/test__time.py — all importorskip("mne")
    "mne",
    "pytest",
    "pytest-cov",
    "ruff",
    "scitex-dev>=0.11.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-dsp[audio]",
    "scitex-dsp[pac]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-dsp"
Repository = "https://github.com/ywatanabe1989/scitex-dsp"
Documentation = "https://scitex-dsp.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_dsp = [
  "_skills/**/*.md",
  "_sphinx_html/**/*",
  "_sphinx_html/.nojekyll",
]

[project.entry-points."scitex_dev.skills"]
scitex-dsp = "scitex_dsp"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-warnings"]

[tool.coverage.run]
parallel = true
source = ["scitex_dsp"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples", "apps", "config", "docs"]
